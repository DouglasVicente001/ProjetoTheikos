<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Álbum de Fotos - Theikos</title>
    <link rel="stylesheet" href="album.css">
</head>
<body>
    <div class="logo-container">
        <img src="your-logo.png" alt="Logo da Marca" class="logo">
    </div>
    <div class="album-container">
        <h1>Álbum de Fotos</h1>
        <div class="gallery">
            <img src="foto1.jpg" alt="Foto 1" onclick="openLightbox(this)">
            <img src="foto2.jpg" alt="Foto 2" onclick="openLightbox(this)">
            <img src="foto3.jpg" alt="Foto 3" onclick="openLightbox(this)">
            <img src="foto4.jpg" alt="Foto 4" onclick="openLightbox(this)">
            <img src="foto5.jpg" alt="Foto 5" onclick="openLightbox(this)">
            <img src="foto6.jpg" alt="Foto 6" onclick="openLightbox(this)">
            <img src="foto7.jpg" alt="Foto 7" onclick="openLightbox(this)">
            <img src="foto8.jpg" alt="Foto 8" onclick="openLightbox(this)">
            <img src="foto9.jpg" alt="Foto 9" onclick="openLightbox(this)">
            <img src="foto10.jpg" alt="Foto 10" onclick="openLightbox(this)">
            <img src="foto11.jpg" alt="Foto 11" onclick="openLightbox(this)">
            <img src="foto12.jpg" alt="Foto 12" onclick="openLightbox(this)">
            <img src="foto13.jpg" alt="Foto 13" onclick="openLightbox(this)">
            <img src="foto14.jpg" alt="Foto 14" onclick="openLightbox(this)">
            <img src="foto15.jpg" alt="Foto 15" onclick="openLightbox(this)">
        </div>
    </div>
    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <img id="lightbox-img" src="" alt="Foto ampliada">
    </div>
    <script>
        function openLightbox(img) {
            document.getElementById('lightbox-img').src = img.src;
            document.getElementById('lightbox').style.display = 'flex';
        }
        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }
    </script>
    <div class="back-button-container">
        <a href="index.html">
            <img src="button-inicio.png" alt="Voltar para o início" class="back-button-img">
        </a>
    </div>
</body>
</html>
